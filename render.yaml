services:
  # -------------------------------------------------------------
  # FactGuard AI Unified Service (FastAPI + Next.js UI)
  # -------------------------------------------------------------
  - type: web
    name: factguard
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: OMP_NUM_THREADS
        value: "1"
