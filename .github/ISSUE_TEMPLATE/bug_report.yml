name: 🐛 Bug Report
description: Report an issue or bug with FactGuard AI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: claim
    attributes:
      label: Tested Claim or Statement
      description: What statement or input triggered the issue?
      placeholder: "e.g., Bananas are radioactive"
    validations:
      required: false
  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider Used
      options:
        - Groq (Default)
        - Ollama (Local)
        - OpenAI
        - Google Gemini
        - Anthropic Claude
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

