name: 💡 Feature Request
description: Suggest an idea or enhancement for FactGuard AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature to improve FactGuard AI!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like to see.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Search Provider (e.g. Google, Tavily, Bing)
        - New LLM Integration / Local Model
        - Browser Extension Feature
        - Python SDK / LangChain / LlamaIndex Tool
        - Benchmark & Evaluation
        - UI / UX Enhancement
    validations:
      required: true
