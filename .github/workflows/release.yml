name: Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-assets:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install wheel build twine

      - name: Build Python Package
        run: |
          python -m build
          twine check dist/*

      - name: Package Chrome Extension (.zip)
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.1.0}"
          cd extension
          zip -r "../factguard-extension-${TAG_NAME}.zip" . -x "*.git*"
          cd ..
          ls -la factguard-extension-*.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            factguard-extension-*.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

