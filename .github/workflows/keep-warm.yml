name: Keep Render Service Warm

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier from spinning down after 15m
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping FactGuard Unified Service
        run: |
          TARGET_URL="${{ vars.FACTGUARD_URL || 'https://factguard-1gge.onrender.com' }}"
          echo "Pinging FactGuard Service at $TARGET_URL/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health")
          echo "Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Service returned status $HTTP_STATUS, retrying after 5s..."
            sleep 5
            curl -s -f "$TARGET_URL/health" || true
          fi
