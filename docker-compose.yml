services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: factguard:latest
    container_name: factguard
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
