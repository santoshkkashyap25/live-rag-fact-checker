[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factguard"
version = "2.0.0"
description = "Real-time web intelligence and multi-LLM fact-checking Python SDK"
readme = "factguard/README.md"
authors = [
    { name = "Santosh Kashyap", email = "santoshkkashyap25@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "fact-checking",
    "rag",
    "llm",
    "hallucination-detection",
    "groq",
    "ollama",
    "duckduckgo",
    "wikipedia",
    "truthfulqa"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0"
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://factguard-1gge.onrender.com"
Repository = "https://github.com/santoshkkashyap25/live-rag-fact-checker"
Issues = "https://github.com/santoshkkashyap25/live-rag-fact-checker/issues"
